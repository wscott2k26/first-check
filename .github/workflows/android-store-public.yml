name: First Check Android Store Build

on:
  push:
    branches: [main]
    paths:
      - 'ci/apply-store-v3-hardening.mjs'
      - 'ci/apply-storm-brand-v4.mjs'
      - 'ci/storm-brand-v4.payload.part*'
      - 'ci/apply-first-check-pro.mjs'
      - 'ci/apply-first-check-pro-code4.mjs'
      - 'ci/apply-first-check-pro-billing-hardening.mjs'
      - 'ci/test-apply-first-check-pro-billing-hardening.mjs'
      - 'ci/assert-first-check-pro-code4.mjs'
      - 'ci/assert-pro-billing-ready.mjs'
      - 'ci/test-assert-pro-billing-ready.mjs'
      - 'ci/release-input-fingerprint.sh'
      - 'ci/test-store-workflow-pr-contract.mjs'
      - 'ci/first-check-pro.payload.part*'
      - '.github/workflows/android-store-public.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci/apply-store-v3-hardening.mjs'
      - 'ci/apply-storm-brand-v4.mjs'
      - 'ci/storm-brand-v4.payload.part*'
      - 'ci/apply-first-check-pro.mjs'
      - 'ci/apply-first-check-pro-code4.mjs'
      - 'ci/apply-first-check-pro-billing-hardening.mjs'
      - 'ci/test-apply-first-check-pro-billing-hardening.mjs'
      - 'ci/assert-first-check-pro-code4.mjs'
      - 'ci/assert-pro-billing-ready.mjs'
      - 'ci/test-assert-pro-billing-ready.mjs'
      - 'ci/release-input-fingerprint.sh'
      - 'ci/test-store-workflow-pr-contract.mjs'
      - 'ci/first-check-pro.payload.part*'
      - '.github/workflows/android-store-public.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first-check-android-store-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build-store-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public First Check CI repo
        uses: actions/checkout@v4

      - name: Record build start
        if: github.event_name != 'pull_request'
        run: |
          git pull --rebase origin main || true
          printf '{"status":"started","run_id":%s,"started_at":"%s"}\n' '${{ github.run_id }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci/store-build-start.json
          git config user.name 'First Check CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/store-build-start.json
          git commit -m "ci: record store build start ${{ github.run_id }}" || true
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version
          java -version
      - name: Run release-hardening unit contracts
        run: |
          node --test ci/test-assert-pro-billing-ready.mjs
          node --test ci/test-apply-first-check-pro-billing-hardening.mjs
          python3 ci/test_release_input_fingerprint.py
          node --test ci/test-runtime-workflow-contract.mjs
          node --test ci/test-store-workflow-pr-contract.mjs
      - name: Reconstruct verified CI source
        run: bash ci/RECONSTRUCT.sh
      - name: Apply existing Air + SDK compatibility
        run: |
          node ci/apply-premium-mobile-theme.mjs build-src
          node ci/apply-expo-sdk57-compat.mjs build-src
          node ci/apply-typescript-sdk57-compat.mjs build-src
          node ci/apply-mobile-tsconfig-sdk57-compat.mjs build-src
          node ci/apply-mobile-typescript-source-compat.mjs build-src
          node ci/restore-workspace-config.mjs build-src
      - name: Apply V3 store hardening
        run: node ci/apply-store-v3-hardening.mjs build-src
      - name: Apply Storm And Me V4 brand polish
        run: node ci/apply-storm-brand-v4.mjs build-src
      - name: Apply First Check Pro V1.1
        run: node ci/apply-first-check-pro.mjs build-src
      - name: Carry clean-launch recovery into Pro code 4
        run: node ci/apply-first-check-pro-code4.mjs build-src
      - name: Verify Pro code 4 + clean-launch contract
        run: node ci/assert-first-check-pro-code4.mjs build-src
      - name: Harden Pro localized pricing + trial copy
        run: node ci/apply-first-check-pro-billing-hardening.mjs build-src
      - name: Diagnose PR Pro billing source before gate
        if: github.event_name == 'pull_request'
        run: |
          echo '=== pro.tsx pricing + RevenueCat references ==='
          grep -n -C 8 -E '\$9\.99|\$79\.99|REVENUECAT|priceString|introPrice|freePhase|trial' build-src/apps/mobile/app/pro.tsx || true
          echo '=== billing source files ==='
          find build-src/apps/mobile/src/billing -maxdepth 1 -type f -print | sort
          for FILE in $(find build-src/apps/mobile/src/billing -maxdepth 1 -type f | sort); do
            echo "===== $FILE ====="
            sed -n '1,260p' "$FILE"
          done
      - name: Verify Pro billing + paywall contract
        run: node ci/assert-pro-billing-ready.mjs build-src
      - name: Stage CI applicator contract for tests
        run: |
          mkdir -p build-src/ci
          cp ci/apply-storm-brand-v4.mjs build-src/ci/apply-storm-brand-v4.mjs
      - name: Run Pro and brand regression tests
        working-directory: build-src
        run: |
          node --experimental-strip-types --test \
            scripts/billing-policy.test.mjs \
            scripts/billing-client-contract.test.mjs \
            scripts/billing-provider-contract.test.mjs \
            scripts/pro-paywall-contract.test.mjs \
            scripts/pro-feature-gates.test.mjs \
            scripts/pro-more-screen.test.mjs \
            scripts/pro-release-contract.test.mjs \
            scripts/brand-polish.test.mjs
      - name: Stage PR billing inspection evidence
        if: github.event_name == 'pull_request'
        run: |
          rm -rf /tmp/first-check-pro-pr-inspection
          mkdir -p /tmp/first-check-pro-pr-inspection
          cp -R build-src/apps/mobile/src/billing /tmp/first-check-pro-pr-inspection/billing
          cp build-src/apps/mobile/app.config.ts /tmp/first-check-pro-pr-inspection/app.config.ts
          cp build-src/apps/mobile/app/pro.tsx /tmp/first-check-pro-pr-inspection/pro.tsx
          cp build-src/apps/mobile/package.json /tmp/first-check-pro-pr-inspection/mobile-package.json
          find build-src -maxdepth 4 -name eas.json -type f -exec cp '{}' /tmp/first-check-pro-pr-inspection/eas.json \; -quit || true
          cp build-src/scripts/billing-policy.test.mjs /tmp/first-check-pro-pr-inspection/
          cp build-src/scripts/billing-client-contract.test.mjs /tmp/first-check-pro-pr-inspection/
          cp build-src/scripts/billing-provider-contract.test.mjs /tmp/first-check-pro-pr-inspection/
          grep -Rni 'REVENUECAT_ANDROID_API_KEY' build-src/apps/mobile > /tmp/first-check-pro-pr-inspection/revenuecat-key-hook.txt || true
      - name: Upload PR billing inspection evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: first-check-pro-pr-inspection
          path: /tmp/first-check-pro-pr-inspection
          retention-days: 7
      - name: Fingerprint exact release inputs
        working-directory: build-src
        run: |
          bash ../ci/release-input-fingerprint.sh . | tee /tmp/first-check-pro-v1.1-code4-source.sha256
          test "$(wc -c < /tmp/first-check-pro-v1.1-code4-source.sha256)" -eq 65
      - name: Install and lock dependencies
        working-directory: build-src
        run: |
          pnpm install --no-frozen-lockfile
          test -s pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - name: Build shared packages and typecheck mobile
        working-directory: build-src
        run: |
          pnpm --filter @first-check/schemas build
          pnpm --filter @first-check/domain build
          pnpm --filter @first-check/ui build
          pnpm --filter @first-check/api-client build
          pnpm --filter @first-check/mobile typecheck
          pnpm --filter @first-check/mobile exec expo install --check
      - name: Verify release contract after real package builds
        working-directory: build-src
        run: node scripts/store-release-contract.mjs
      - name: Generate Android API 36 project
        working-directory: build-src/apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Verify package, Pro version and strip debug signing from release
        working-directory: build-src
        run: |
          grep -q 'com.stormandme.firstcheck' apps/mobile/android/app/build.gradle
          grep -q 'targetSdkVersion rootProject.ext.targetSdkVersion' apps/mobile/android/app/build.gradle
          grep -q 'versionCode 4' apps/mobile/android/app/build.gradle
          grep -q '"version": "1.1.0"' apps/mobile/app.json
          grep -q '"buildNumber": "2"' apps/mobile/app.json
          grep -q 'react-native-purchases' apps/mobile/package.json
          grep -q 'Storm And Me Studios' apps/mobile/src/brand/brand-intro.tsx
          grep -q '#07111F' apps/mobile/app.config.ts
          grep -q '<Stack.Screen name="index" />' apps/mobile/app/_layout.tsx
          test -s apps/mobile/app/index.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile/android/app/build.gradle')
          s=p.read_text()
          s=s.replace('signingConfig signingConfigs.debug','')
          p.write_text(s)
          PY
          if grep -R --line-number -E '<uses-permission[^>]+android.permission.(RECORD_AUDIO|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO)' apps/mobile/android/app/src/main/AndroidManifest.xml | grep -v 'tools:node="remove"'; then exit 1; fi
      - name: Build unsigned release AAB
        working-directory: build-src/apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          cp "$AAB" /tmp/first-check-pro-v1.1-code4-unsigned-release.aab
          sha256sum /tmp/first-check-pro-v1.1-code4-unsigned-release.aab | tee /tmp/first-check-pro-v1.1-code4-unsigned-release.sha256
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: first-check-pro-v1.1-code4-unsigned-store-aab
          path: |
            /tmp/first-check-pro-v1.1-code4-unsigned-release.aab
            /tmp/first-check-pro-v1.1-code4-unsigned-release.sha256
            /tmp/first-check-pro-v1.1-code4-source.sha256
          retention-days: 7
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: first-check-pro-v1.1-code4-pnpm-lockfile
          path: build-src/pnpm-lock.yaml
          retention-days: 7
      - name: Record build result
        if: always() && github.event_name != 'pull_request'
        run: |
          git pull --rebase origin main || true
          AAB_SHA=''
          INPUT_SHA=''
          test ! -f /tmp/first-check-pro-v1.1-code4-unsigned-release.sha256 || AAB_SHA="$(cut -d' ' -f1 /tmp/first-check-pro-v1.1-code4-unsigned-release.sha256)"
          test ! -f /tmp/first-check-pro-v1.1-code4-source.sha256 || INPUT_SHA="$(tr -d '\r\n ' < /tmp/first-check-pro-v1.1-code4-source.sha256)"
          printf '{"status":"%s","run_id":%s,"finished_at":"%s","source_head_sha":"%s","release_input_sha256":"%s","release":"1.1.0","version_code":4,"ios_build":"2","unsigned_aab_sha256":"%s"}\n' '${{ job.status }}' '${{ github.run_id }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '${{ github.sha }}' "$INPUT_SHA" "$AAB_SHA" > ci/store-build-result.json
          git add ci/store-build-result.json
          git commit -m "ci: Pro v1.1 code4 build result ${{ github.run_id }} ${{ job.status }}" || true
          git push origin HEAD:main
