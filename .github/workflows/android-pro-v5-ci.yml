name: First Check Pro V5 CI

on:
  push:
    branches: [first-check-pro-v5-ci]
    paths:
      - 'ci/apply-first-check-pro-v5.mjs'
      - '.github/workflows/android-pro-v5-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-check-pro-v5-ci
  cancel-in-progress: false

jobs:
  verify-pro-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Pro branch
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          node --version
          pnpm --version
          java -version

      - name: Reconstruct verified First Check source
        run: bash ci/RECONSTRUCT.sh

      - name: Reapply existing release compatibility and brand layers
        run: |
          node ci/apply-premium-mobile-theme.mjs build-src
          node ci/apply-expo-sdk57-compat.mjs build-src
          node ci/apply-typescript-sdk57-compat.mjs build-src
          node ci/apply-mobile-tsconfig-sdk57-compat.mjs build-src
          node ci/apply-mobile-typescript-source-compat.mjs build-src
          node ci/restore-workspace-config.mjs build-src
          node ci/apply-store-v3-hardening.mjs build-src
          node ci/apply-storm-brand-v4.mjs build-src

      - name: Apply First Check Pro V5
        run: node ci/apply-first-check-pro-v5.mjs build-src

      - name: Run deterministic Pro and brand contracts before install
        working-directory: build-src
        run: |
          node --experimental-strip-types scripts/pro-access.test.mjs
          node scripts/pro-provider-contract.test.mjs
          node scripts/pro-ui-contract.test.mjs
          node scripts/pro-release-contract.test.mjs
          node --experimental-strip-types scripts/brand-polish.test.mjs

      - name: Install and lock dependencies
        working-directory: build-src
        run: |
          pnpm install --no-frozen-lockfile
          test -s pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Build workspaces and typecheck Pro client
        working-directory: build-src
        run: |
          pnpm --filter @first-check/schemas build
          pnpm --filter @first-check/domain build
          pnpm --filter @first-check/ui build
          pnpm --filter @first-check/api-client build
          pnpm --filter @first-check/mobile typecheck

      - name: Expo dependency compatibility check
        working-directory: build-src
        run: pnpm --filter @first-check/mobile exec expo install --check

      - name: Expo Doctor
        working-directory: build-src/apps/mobile
        run: pnpm dlx expo-doctor@latest

      - name: Generate Android and iOS native projects
        working-directory: build-src/apps/mobile
        run: pnpm exec expo prebuild --clean --no-install

      - name: Verify release identities and native RevenueCat presence
        working-directory: build-src
        run: |
          test -d apps/mobile/android
          test -d apps/mobile/ios
          grep -q 'com.stormandme.firstcheck' apps/mobile/android/app/build.gradle
          grep -q 'versionCode 3' apps/mobile/android/app/build.gradle
          grep -R -q 'com.stormandme.firstcheck' apps/mobile/ios
          test -d node_modules/.pnpm/react-native-purchases@10.5.0*/node_modules/react-native-purchases || test -d apps/mobile/node_modules/react-native-purchases
          grep -q 'Storm And Me Studios' apps/mobile/src/brand/brand-intro.tsx
          grep -q 'react-native-purchases' apps/mobile/package.json

      - name: Strip debug signing from Android release
        working-directory: build-src
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile/android/app/build.gradle')
          s=p.read_text()
          s=s.replace('signingConfig signingConfigs.debug','')
          p.write_text(s)
          PY

      - name: Build unsigned Android Pro AAB
        working-directory: build-src/apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          cp "$AAB" /tmp/first-check-pro-v5-unsigned.aab
          sha256sum /tmp/first-check-pro-v5-unsigned.aab | tee /tmp/first-check-pro-v5-unsigned.sha256

      - name: Package generated iOS project for structural verification
        working-directory: build-src/apps/mobile
        run: |
          tar -czf /tmp/first-check-pro-v5-ios-prebuild.tgz ios
          sha256sum /tmp/first-check-pro-v5-ios-prebuild.tgz | tee /tmp/first-check-pro-v5-ios-prebuild.sha256

      - name: Upload Pro verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: first-check-pro-v5-verification
          path: |
            /tmp/first-check-pro-v5-unsigned.aab
            /tmp/first-check-pro-v5-unsigned.sha256
            /tmp/first-check-pro-v5-ios-prebuild.tgz
            /tmp/first-check-pro-v5-ios-prebuild.sha256
            build-src/pnpm-lock.yaml
          retention-days: 7
