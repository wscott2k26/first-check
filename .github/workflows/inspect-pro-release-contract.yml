name: Inspect First Check Pro Release Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-pro-release-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: bash ci/RECONSTRUCT.sh
      - run: |
          node ci/apply-premium-mobile-theme.mjs build-src
          node ci/apply-expo-sdk57-compat.mjs build-src
          node ci/apply-typescript-sdk57-compat.mjs build-src
          node ci/apply-mobile-tsconfig-sdk57-compat.mjs build-src
          node ci/apply-mobile-typescript-source-compat.mjs build-src
          node ci/restore-workspace-config.mjs build-src
          node ci/apply-store-v3-hardening.mjs build-src
          node ci/apply-storm-brand-v4.mjs build-src
          node ci/apply-first-check-pro.mjs build-src
      - name: Record dependency contract lines
        run: |
          grep -n "Mobile expo" build-src/scripts/store-release-contract.mjs > ci/pro-release-dependency-contract.txt || true
          git pull --rebase origin main || true
          git config user.name 'First Check CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/pro-release-dependency-contract.txt
          git commit -m "ci: record Pro release dependency contract" || true
          git push origin HEAD:main
