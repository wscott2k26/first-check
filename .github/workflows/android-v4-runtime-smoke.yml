name: First Check V4 Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-v4-runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout CI carrier
        uses: actions/checkout@v4

      - name: Record runtime smoke start
        run: |
          printf '{"status":"started","run_id":%s,"started_at":"%s"}\n' '${{ github.run_id }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci/v4-runtime-smoke-result.json
          git config user.name 'First Check CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/v4-runtime-smoke-result.json
          git commit -m "ci: V4 runtime smoke start ${{ github.run_id }}" || true
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Reconstruct exact V4 source
        run: |
          bash ci/RECONSTRUCT.sh
          node ci/apply-premium-mobile-theme.mjs build-src
          node ci/apply-expo-sdk57-compat.mjs build-src
          node ci/apply-typescript-sdk57-compat.mjs build-src
          node ci/apply-mobile-tsconfig-sdk57-compat.mjs build-src
          node ci/apply-mobile-typescript-source-compat.mjs build-src
          node ci/restore-workspace-config.mjs build-src
          node ci/apply-store-v3-hardening.mjs build-src
          node ci/apply-storm-brand-v4.mjs build-src

      - name: Install and compile exact V4 source
        working-directory: build-src
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @first-check/schemas build
          pnpm --filter @first-check/domain build
          pnpm --filter @first-check/ui build
          pnpm --filter @first-check/api-client build
          pnpm --filter @first-check/mobile typecheck
          pnpm --filter @first-check/mobile exec expo install --check

      - name: Generate Android release project
        working-directory: build-src/apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build installable release APK for exact V4
        working-directory: build-src/apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk /tmp/first-check-v4-release.apk
          sha256sum /tmp/first-check-v4-release.apk

      - name: Launch exact V4 release on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -o pipefail
            adb install -r /tmp/first-check-v4-release.apk
            adb logcat -c
            adb shell am force-stop com.stormandme.firstcheck
            adb shell monkey -p com.stormandme.firstcheck -c android.intent.category.LAUNCHER 1
            sleep 12
            echo '=== PID ==='
            adb shell pidof com.stormandme.firstcheck || true
            echo '=== CURRENT ACTIVITY ==='
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            echo '=== FIRST CHECK CRASH LOGS ==='
            adb logcat -d -v threadtime | grep -E -A80 -B20 'FATAL EXCEPTION|AndroidRuntime|Process: com.stormandme.firstcheck|com.stormandme.firstcheck' | tail -n 500 | tee /tmp/first-check-v4-logcat.txt || true
            adb exec-out screencap -p > /tmp/first-check-v4-screen.png || true
            PID="$(adb shell pidof com.stormandme.firstcheck | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo 'RUNTIME_SMOKE=FAIL: First Check process died after cold launch.'
              exit 1
            fi
            if grep -qE 'FATAL EXCEPTION.*|Process: com.stormandme.firstcheck' /tmp/first-check-v4-logcat.txt; then
              echo 'RUNTIME_SMOKE=FAIL: fatal exception detected.'
              exit 1
            fi
            echo 'RUNTIME_SMOKE=PASS: exact V4 release remained alive after cold launch.'

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-check-v4-runtime-evidence
          path: |
            /tmp/first-check-v4-logcat.txt
            /tmp/first-check-v4-screen.png
          retention-days: 7

      - name: Record runtime smoke result
        if: always()
        run: |
          git pull --rebase origin main || true
          printf '{"status":"%s","run_id":%s,"finished_at":"%s"}\n' '${{ job.status }}' '${{ github.run_id }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci/v4-runtime-smoke-result.json
          git add ci/v4-runtime-smoke-result.json
          git commit -m "ci: V4 runtime smoke result ${{ github.run_id }} ${{ job.status }}" || true
          git push origin HEAD:main
