name: First Check Pro 1.1 Code 4 Runtime Smoke

on:
  workflow_run:
    workflows: ["First Check Android Store Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: "Successful First Check Android Store Build run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: first-check-pro-code4-runtime
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.meta.outputs.build_status }}
      source_run: ${{ steps.meta.outputs.source_run }}
      source_head_sha: ${{ steps.meta.outputs.source_head_sha }}
      aab_sha: ${{ steps.meta.outputs.aab_sha }}
      release_input_sha: ${{ steps.meta.outputs.release_input_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Resolve and verify exact Pro store build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test '${{ github.event_name }}' = workflow_run; then
            RUN='${{ github.event.workflow_run.id }}'
            STATUS='${{ github.event.workflow_run.conclusion }}'
            HEAD_SHA='${{ github.event.workflow_run.head_sha }}'
          else
            RUN='${{ inputs.source_run }}'
            STATUS="$(gh run view "$RUN" --repo '${{ github.repository }}' --json conclusion -q .conclusion)"
            HEAD_SHA="$(gh run view "$RUN" --repo '${{ github.repository }}' --json headSha -q .headSha)"
          fi

          echo "build_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "source_run=$RUN" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          test "$STATUS" = success

          mkdir -p /tmp/pro-code4-preflight
          gh run download "$RUN" --repo '${{ github.repository }}' \
            -n first-check-pro-v1.1-code4-unsigned-store-aab \
            -D /tmp/pro-code4-preflight
          AAB=/tmp/pro-code4-preflight/first-check-pro-v1.1-code4-unsigned-release.aab
          EXPECTED_SHA="$(cut -d' ' -f1 /tmp/pro-code4-preflight/first-check-pro-v1.1-code4-unsigned-release.sha256)"
          SOURCE_FINGERPRINT="$(tr -d '\r\n ' < /tmp/pro-code4-preflight/first-check-pro-v1.1-code4-source.sha256)"
          ACTUAL_SHA="$(sha256sum "$AAB" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(printf '%s' "$SOURCE_FINGERPRINT" | wc -c)" -eq 64
          echo "aab_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "release_input_sha=$SOURCE_FINGERPRINT" >> "$GITHUB_OUTPUT"

  runtime:
    needs: preflight
    if: needs.preflight.outputs.build_status == 'success'
    name: pro-code4-api-${{ matrix.api }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact Pro code4 AAB
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.preflight.outputs.source_run }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.aab_sha }}
        run: |
          mkdir -p /tmp/pro-code4
          gh run download "$SOURCE_RUN" --repo "${{ github.repository }}" -n first-check-pro-v1.1-code4-unsigned-store-aab -D /tmp/pro-code4
          AAB=/tmp/pro-code4/first-check-pro-v1.1-code4-unsigned-release.aab
          test -s "$AAB"
          ACTUAL="$(shasum -a 256 "$AAB" | awk '{print $1}')"
          echo "AAB_SHA256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_SHA"

      - name: Convert exact AAB to installable universal APK
        run: |
          curl -fsSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=/tmp/pro-code4/first-check-pro-v1.1-code4-unsigned-release.aab \
            --output=/tmp/pro-code4.apks \
            --mode=universal \
            --ks=/tmp/debug.keystore \
            --ks-key-alias=androiddebugkey \
            --ks-pass=pass:android \
            --key-pass=pass:android \
            --overwrite
          unzip -q /tmp/pro-code4.apks universal.apk -d /tmp/pro-code4
          test -s /tmp/pro-code4/universal.apk

      - name: Five-launch stabilized First Check Pro gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash ci/run-pro-code4-smoke-stable.sh ${{ matrix.api }} /tmp/pro-code4/universal.apk

      - name: Upload Pro runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-check-pro-v1.1-code4-runtime-api-${{ matrix.api }}
          path: |
            /tmp/first-check-pro-code4-api-${{ matrix.api }}.logcat.txt
            /tmp/first-check-pro-code4-api-${{ matrix.api }}.ui.xml
            /tmp/first-check-pro-code4-api-${{ matrix.api }}.png
            /tmp/first-check-pro-code4-start-${{ matrix.api }}-*.txt
            /tmp/pro-code4-android-system-dialog-${{ matrix.api }}-*.xml
          retention-days: 7

  gate:
    if: always()
    needs: [preflight, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record Pro runtime result
        run: |
          BUILD='${{ needs.preflight.outputs.build_status }}'
          STATUS='gated'
          RUNTIME='skipped'
          if test "$BUILD" = success; then
            STATUS='failure'
            RUNTIME='${{ needs.runtime.result }}'
            if test "$RUNTIME" = success; then STATUS='success'; fi
          fi
          git pull --rebase origin main || true
          printf '{"status":"%s","run_id":%s,"source_run":%s,"source_head_sha":"%s","release_input_sha256":"%s","release":"1.1.0","version_code":4,"runtime":"%s","apis":[35,36],"cold_launches_per_api":5,"unsigned_aab_sha256":"%s"}\n' \
            "$STATUS" '${{ github.run_id }}' '${{ needs.preflight.outputs.source_run }}' '${{ needs.preflight.outputs.source_head_sha }}' '${{ needs.preflight.outputs.release_input_sha }}' "$RUNTIME" '${{ needs.preflight.outputs.aab_sha }}' > ci/pro-code4-runtime-result.json
          git config user.name 'First Check CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/pro-code4-runtime-result.json
          git commit -m "ci: Pro code4 runtime result ${{ github.run_id }} $STATUS" || true
          git push origin HEAD:main
          if test "$BUILD" = success; then test "$STATUS" = success; fi
