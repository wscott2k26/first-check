name: First Check Pro Code 4 Contract

on:
  push:
    branches: [main]
    paths:
      - 'ci/assert-first-check-pro-code4.mjs'
      - 'ci/apply-first-check-pro-code4.mjs'
      - '.github/workflows/pro-code4-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Reconstruct V4 source
        run: bash ci/RECONSTRUCT.sh
      - name: Apply existing compatibility and brand layers
        run: |
          node ci/apply-premium-mobile-theme.mjs build-src
          node ci/apply-expo-sdk57-compat.mjs build-src
          node ci/apply-typescript-sdk57-compat.mjs build-src
          node ci/apply-mobile-tsconfig-sdk57-compat.mjs build-src
          node ci/apply-mobile-typescript-source-compat.mjs build-src
          node ci/restore-workspace-config.mjs build-src
          node ci/apply-store-v3-hardening.mjs build-src
          node ci/apply-storm-brand-v4.mjs build-src
          node ci/apply-first-check-pro.mjs build-src
      - name: Pro code 4 + clean-launch contract
        run: node ci/assert-first-check-pro-code4.mjs build-src
